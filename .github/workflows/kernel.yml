name: Acer T482L kernel build

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y bc bison device-tree-compiler flex gcc-aarch64-linux-gnu libelf-dev libncurses-dev libssl-dev make python-is-python3

      - name: Stop warnings from failing the build
        run: |
          find . -type f \( -name 'Makefile*' -o -name 'Kbuild*' \) \
            -not -path './tools/*' -not -path './scripts/*' \
            -exec sed -i -E 's/(^|[[:space:]])-Werror([[:space:]]|$)/\1\2/g' {} +

      - name: Build compressed kernel image
        env:
          ARCH: arm64
          CROSS_COMPILE: aarch64-linux-gnu-
          JOBS: 4
          MAKEFLAGS: -k
        run: |
          set -o pipefail
          bash ./build.sh 2>&1 | tee build.log
          test -s out/acer_t482l/arch/arm64/boot/Image.gz

      - name: Show real errors
        if: failure()
        run: |
          if [ -f build.log ]; then
            grep -nE -A3 'error:|\*\*\*|undefined reference|No rule to make' build.log > errors.log || true
            head -150 errors.log
          else
            echo "build.log was not created. Check the earlier steps."
          fi

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          if-no-files-found: warn

      - name: Publish to Releases
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: build-${{ github.run_number }}-${{ github.run_attempt }}
        run: |
          cp out/acer_t482l/arch/arm64/boot/Image.gz Image.gz
          sha256sum Image.gz > Image.gz.sha256
          gh release create "$TAG" Image.gz Image.gz.sha256 \
            --target "$GITHUB_SHA" \
            --title "Acer T482L kernel $TAG" \
            --notes "Untested kernel build from commit $GITHUB_SHA. Kernel only, not a flashable boot.img." \
            --prerelease